[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "residual-grid-research"
version = "0.1.0"
description = "Standalone residual-grid and breakout-continuation trading research system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "requests>=2.31",
  "yfinance>=0.2.65",
  "exchange-calendars>=4.13,<5",
]

[project.optional-dependencies]
research = ["scipy>=1.11", "statsmodels>=0.14", "matplotlib>=3.8"]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
residual-grid = "residual_grid_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
